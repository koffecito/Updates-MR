name: Poll bot chat membership

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: bot-state
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Poll for new chats
        env:
          APP_ID: ${{ vars.APP_ID }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          OWNER_USER_ID: ${{ vars.OWNER_USER_ID }}
        run: go run . poll

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "chore: update bot state (poll)"
          git pull --rebase
          git push
